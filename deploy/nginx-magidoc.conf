# Host nginx site for MagiDoc.
#   1. Replace magidoc.example.com below with your domain.
#   2. sudo cp deploy/nginx-magidoc.conf /etc/nginx/sites-available/magidoc
#      sudo ln -s /etc/nginx/sites-available/magidoc /etc/nginx/sites-enabled/magidoc
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d magidoc.example.com --redirect   (adds HTTPS + the http→https redirect)
server {
    listen 80;
    listen [::]:80;
    server_name magidoc.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;   # MAGIDOC_HTTP_PORT from .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This nginx is the edge: overwrite (don't append) so clients can't spoof their IP for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
